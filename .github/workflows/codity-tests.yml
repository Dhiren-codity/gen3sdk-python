name: Codity AI - Run Generated Tests

on:
  pull_request:
    branches: ['**']

permissions:
  contents: write
  pull-requests: write

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov pytest-asyncio openai python-dotenv
          # Fix Flask ecosystem compatibility issues
          pip install 'sqlalchemy<2.0.0' 'flask-sqlalchemy>=3.0.0' || true
          pip install 'werkzeug<3.0.0' 'flask>=2.3.0,<3.0.0' || true
      - name: Install project dependencies
        run: |
          echo "🔍 Checking for Python dependency files..."
          DEPS_INSTALLED=false

          if [ -f "requirements.txt" ]; then
            echo "📦 Installing from requirements.txt..."
            pip install -r requirements.txt --timeout 300 || echo "⚠️ Some requirements failed to install"
            DEPS_INSTALLED=true
          fi

          if [ -f "requirements-dev.txt" ]; then
            echo "📦 Installing dev requirements..."
            pip install -r requirements-dev.txt --timeout 300 || echo "⚠️ Some dev requirements failed"
            DEPS_INSTALLED=true
          fi

          if [ -f "pyproject.toml" ]; then
            echo "📦 Found pyproject.toml..."

            # Check if it's a Poetry project
            if grep -q "tool.poetry" pyproject.toml && grep -q "poetry.masonry.api" pyproject.toml; then
              echo "🎭 Detected Poetry project"

              # Install Poetry
              pip install poetry || echo "⚠️ Poetry installation failed"

              # Try poetry export + pip install
              if poetry export -f requirements.txt --output /tmp/poetry-reqs.txt --without-hashes 2>/dev/null; then
                echo "📦 Installing from Poetry export..."
                pip install -r /tmp/poetry-reqs.txt --timeout 300 || echo "⚠️ Some Poetry deps failed"
                DEPS_INSTALLED=true
              elif poetry install --no-interaction 2>/dev/null; then
                # Fallback to poetry install (creates virtualenv but installs deps)
                echo "✅ Poetry install succeeded"
                DEPS_INSTALLED=true
              else
                echo "⚠️ Both poetry export and poetry install failed"
              fi
            else
              echo "📦 Installing from pyproject.toml..."
              pip install -e . --timeout 300 || echo "⚠️ Package install failed"
              DEPS_INSTALLED=true
            fi
          fi

          if [ -f "setup.py" ]; then
            echo "📦 Installing from setup.py..."
            pip install -e . --timeout 300 || echo "⚠️ Setup.py install failed"
            DEPS_INSTALLED=true
          fi

          if [ "$DEPS_INSTALLED" = true ]; then
            echo "✅ Dependency installation completed"
          else
            echo "ℹ️ No dependency files found - continuing with test dependencies only"
          fi
        continue-on-error: true
      - name: Format test files with autopep8
        run: |
          echo "🎨 Formatting generated test files..."
          pip install autopep8
          for file in gen3/external/nih/dbgap_study_metadata_test.py; do
            if [ -f "$file" ]; then
              echo "Formatting $file"
              autopep8 --in-place --aggressive --aggressive "$file" || true
            fi
          done
      - name: Run tests
        id: test_run
        continue-on-error: true
        run: pytest gen3/external/nih/dbgap_study_metadata_test.py -v
      - name: Auto-fix failing tests
        if: steps.test_run.outcome == 'failure'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "🔧 Tests failed, attempting auto-fix..."

          # Check if API keys are available
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "⚠️ WARNING: No API keys found (OPENAI_API_KEY and ANTHROPIC_API_KEY)"
            echo "   Auto-fix will use fallback strategies:"
            echo "   1. Install real dependencies from requirements.txt/pyproject.toml"
            echo "   2. sys.modules mocking via conftest.py"
            echo "   3. Nuclear option (remove failing tests)"
            echo ""
          fi

          # Run auto-fix (works even without API keys using dependency installation + nuclear option)
          python3 test_generation/execution/github_auto_fix.py gen3/external/nih/dbgap_study_metadata_test.py
      - name: Format after auto-fix
        if: steps.test_run.outcome == 'failure'
        run: |
          echo "🎨 Re-formatting after auto-fix..."
          for file in gen3/external/nih/dbgap_study_metadata_test.py; do
            if [ -f "$file" ]; then
              autopep8 --in-place --aggressive --aggressive "$file" || true
            fi
          done
      - name: Re-run tests after auto-fix
        if: steps.test_run.outcome == 'failure'
        id: retest
        continue-on-error: true
        run: pytest gen3/external/nih/dbgap_study_metadata_test.py -v
      - name: Commit auto-fixed tests
        if: steps.test_run.outcome == 'failure' && steps.retest.outcome == 'success'
        run: |
          git config user.name "Codity AI"
          git config user.email "bot@codity.ai"
          git add gen3/external/nih/dbgap_study_metadata_test.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix failing tests"
            # Pull and rebase to handle any remote changes
            git pull --rebase origin ${{ github.head_ref }} || true
            # Push with force-with-lease to safely overwrite
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
          fi
